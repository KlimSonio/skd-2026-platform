<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Events – Generator Identyfikatorów</title>
  
  <!-- Biblioteka QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Arial', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    }

    /* Format karty identyfikatora na ekranie */
    .badge-card {
      width: 90mm;
      height: 60mm;
      box-sizing: border-box;
      page-break-inside: avoid;
    }

    /* Układ wydruku A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body {
        background: white !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .badge-card {
        border: 1px dashed #cbd5e1 !important;
        box-shadow: none !important;
        background: white !important;
      }
      #badges-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 90mm) !important;
        gap: 5mm 8mm !important;
        justify-content: center !important;
        margin: 0 auto !important;
        padding: 0 !important;
      }

      /* Obsługa druku z otwartego modalu (pojedynczy identyfikator) */
      body.print-single-mode #badges-grid {
        display: none !important;
      }
      body.print-single-mode #single-badge-print-area {
        display: flex !important;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      body.print-single-mode #single-badge-print-area .badge-card {
        border: 1px solid #94a3b8 !important;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/badges-DuJtQOp0.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
</head>
<body class="bg-slate-50 text-slate-800 min-h-full flex flex-col antialiased">

  <!-- Pasek górny (no-print) -->
  <header class="no-print bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-40 shadow-xs">
    <div class="flex items-center gap-3">
      <img 
        src="/logo.png" 
        alt="Medical Events Logo" 
        class="h-8 w-auto object-contain"
        onerror="this.onerror=null; this.src='https://medicalevents.pl/wp-content/uploads/2023/04/logo-medical-events.png';" 
      />
      <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900 leading-tight">Generator Identyfikatorów</h1>
        <span class="text-xs text-slate-500 font-normal">Format 90×60 mm (Skład na arkusz A4)</span>
      </div>
    </div>

    <!-- Narzędzia nawigacji -->
    <div class="flex items-center gap-2">
      <a href="/admin.html" class="text-xs font-semibold text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 border border-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-2xs">
        <span>← Panel Admina</span>
      </a>
      <a href="/" target="_blank" class="text-xs font-semibold text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 border border-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-2xs">
        <span>Terminal ↗</span>
      </a>
      <button id="btn-print-action" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-2xs">
        <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        <span>Drukuj arkusz (<span id="print-count">0</span>)</span>
      </button>
    </div>
  </header>

  <!-- Główna zawartość -->
  <main class="flex-1 w-full max-w-[1500px] mx-auto p-4 sm:p-6 flex flex-col gap-4">

    <!-- Pasek Filtrowania i Narzędzi (no-print) -->
    <div class="no-print bg-white border border-slate-200 rounded-xl p-4 shadow-2xs flex flex-col gap-3">
      <div class="flex flex-col lg:flex-row gap-3 items-stretch lg:items-center justify-between">
        
        <!-- Wyszukiwarka -->
        <div class="relative flex-1">
          <input 
            id="badge-search-input" 
            type="text" 
            placeholder="Szukaj po nazwisku, imieniu, PWZ, tokenie..." 
            class="w-full bg-slate-50/70 border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-slate-500 focus:bg-white transition"
          />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <!-- Szybkie filtry statusu -->
        <div id="badge-quick-filters" class="flex items-center gap-1.5 overflow-x-auto text-xs">
          <button data-filter="all" class="b-filter px-2.5 py-1.5 rounded-lg font-medium transition bg-slate-900 text-white">Wszyscy (<span id="count-all">0</span>)</button>
          <button data-filter="paid" class="b-filter px-2.5 py-1.5 rounded-lg font-medium transition bg-slate-100 text-slate-700 hover:bg-slate-200">Opłacone & VIP (<span id="count-paid">0</span>)</button>
          <button data-filter="unpaid" class="b-filter px-2.5 py-1.5 rounded-lg font-medium transition bg-slate-100 text-slate-700 hover:bg-slate-200">Nieopłacone (<span id="count-unpaid">0</span>)</button>
        </div>
      </div>

      <!-- Filtry szczegółowe -->
      <div class="pt-2.5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div>
          <select id="badge-filter-package" class="bg-slate-50/70 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-slate-500">
            <option value="">Wszystkie pakiety</option>
          </select>
        </div>

        <div class="text-slate-500 text-[11px]">
          Gotowe do druku: <strong id="total-visible-count" class="text-slate-900 font-bold">0</strong> identyfikatorów
        </div>
      </div>
    </div>

    <!-- Siatka Identyfikatorów -->
    <div id="badges-grid" class="flex flex-wrap gap-4 justify-center">
      <div class="text-slate-400 text-xs py-12 flex flex-col items-center gap-2">
        <div class="w-6 h-6 border-2 border-slate-300 border-t-slate-800 rounded-full animate-spin"></div>
        <span>Pobieranie bazy uczestników i generowanie identyfikatorów...</span>
      </div>
    </div>

  </main>

  <!-- MODAL: Powiększenie identyfikatora na cały ekran (no-print) -->
  <div id="badge-preview-modal" class="no-print hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-2xl w-full p-6 sm:p-7 shadow-2xl flex flex-col items-center gap-5 my-auto">
      
      <!-- Nagłówek modalu -->
      <div class="w-full flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Podgląd identyfikatora</span>
          <h3 class="font-bold text-slate-900 text-base">Pojedynczy Identyfikator</h3>
        </div>
        <button id="btn-close-badge-modal" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
      </div>

      <!-- Kontener powiększonego identyfikatora (skala x1.5) -->
      <div class="w-full py-8 flex items-center justify-center bg-slate-50 rounded-xl border border-slate-200 overflow-hidden min-h-[340px]">
        <div id="modal-badge-container" class="transform scale-125 sm:scale-150 transition"></div>
      </div>

      <!-- Przyciski akcji modalu -->
      <div class="w-full flex gap-3 border-t border-slate-100 pt-3">
        <button id="btn-close-badge-modal-bottom" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-3 rounded-lg transition">
          Zamknij
        </button>
        <button id="btn-print-single-badge" class="w-2/3 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-3 rounded-lg transition flex items-center justify-center gap-1.5 shadow-2xs">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          <span>Drukuj ten identyfikator</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Niewidoczny kontener pomocniczy dla druku pojedynczego identyfikatora -->
  <div id="single-badge-print-area" class="hidden"></div>

</body>
</html>
