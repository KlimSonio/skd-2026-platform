<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikacja Uczestnika</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Stylowanie dla 4 kwadracików na PIN */
    .pin-input {
      width: 50px; height: 60px; font-size: 24px; text-align: center;
      border: 2px solid #cbd5e1; border-radius: 12px; font-weight: bold;
      background: #f8fafc; color: #0f172a; transition: all 0.2s;
    }
    .pin-input:focus { border-color: #0284c7; outline: none; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- EKRAN 1: Weryfikacja PIN (2FA) -->
  <div id="auth-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-100">
      <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h2 class="text-2xl font-bold mb-2 text-slate-800">Dostęp Chroniony</h2>
      <p class="text-slate-500 mb-6 text-sm">Wpisz 4-cyfrowy kod PIN znajdujący się na odwrocie Twojego identyfikatora.</p>
      
      <div class="flex justify-center gap-3 mb-6">
        <input type="tel" maxlength="1" class="pin-input" data-index="0" autofocus>
        <input type="tel" maxlength="1" class="pin-input" data-index="1">
        <input type="tel" maxlength="1" class="pin-input" data-index="2">
        <input type="tel" maxlength="1" class="pin-input" data-index="3">
      </div>

      <button id="btn-verify" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">
        Odblokuj dostęp
      </button>
      <p id="auth-error" class="text-red-500 text-sm mt-3 hidden">Nieprawidłowy kod PIN. Spróbuj ponownie.</p>
    </div>
  </div>

  <!-- EKRAN 2: Pulpit Uczestnika -->
  <div id="app-screen" class="hidden pb-20">
    <header class="bg-blue-900 text-white p-6 rounded-b-3xl shadow-lg">
      <p class="text-blue-200 text-sm font-medium">Witaj,</p>
      <h1 id="user-name" class="text-2xl font-bold mt-1">Ładowanie...</h1>
    </header>

    <main class="p-6 space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
        <div>
          <h3 class="font-bold text-slate-800">Moja Agenda</h3>
          <p class="text-sm text-slate-500">Wykłady i warsztaty</p>
        </div>
        <div class="bg-slate-100 p-3 rounded-full text-blue-600">📅</div>
      </div>

      <!-- Moduł Networkingowy (wkrótce) -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-5 rounded-2xl shadow-md text-white flex items-center justify-between cursor-pointer" id="btn-network">
        <div>
          <h3 class="font-bold">Networking</h3>
          <p class="text-sm text-blue-100 opacity-90">Skanuj kody QR, aby wymieniać wizytówki</p>
        </div>
        <div class="bg-white/20 p-3 rounded-full">📷</div>
      </div>
    </main>
  </div>

  <script type="module">
    import { CONFIG } from './js/config.js';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const btnVerify = document.getElementById('btn-verify');
    const authError = document.getElementById('auth-error');
    const userNameEl = document.getElementById('user-name');
    const pinInputs = document.querySelectorAll('.pin-input');

    // Automatyczne przechodzenie między okienkami PIN
    pinInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        if(e.target.value.length === 1 && idx < 3) {
          pinInputs[idx + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Backspace' && e.target.value === '' && idx > 0) {
          pinInputs[idx - 1].focus();
        }
        if(e.key === 'Enter') {
          btnVerify.click();
        }
      });
    });

    const savedToken = localStorage.getItem('auth_token');

    if (savedToken && savedToken === token) {
      showApp();
    } else {
      authScreen.classList.remove('hidden');
      authScreen.classList.add('flex');
    }

    btnVerify.addEventListener('click', async () => {
      let pin = '';
      pinInputs.forEach(i => pin += i.value);
      
      if(pin.length !== 4) {
        authError.textContent = "Wpisz wszystkie 4 cyfry PIN.";
        authError.classList.remove('hidden');
        return;
      }

      btnVerify.textContent = 'Sprawdzanie...';
      authError.classList.add('hidden');
      
      try {
        // Zabezpieczony wariant API (z '/directus')
        const res = await fetch(`${CONFIG.API_URL}/items/attendees?filter[qr_token][_eq]=${token}&filter[app_pin][_eq]=${pin}`);
        const data = await res.json();

        if (data.data && data.data.length > 0) {
          localStorage.setItem('auth_token', token);
          localStorage.setItem('user_data', JSON.stringify(data.data[0]));
          
          authScreen.classList.add('hidden');
          authScreen.classList.remove('flex');
          showApp();
        } else {
          authError.textContent = "Nieprawidłowy kod PIN. Spróbuj ponownie.";
          authError.classList.remove('hidden');
          btnVerify.textContent = 'Odblokuj dostęp';
          pinInputs.forEach(i => i.value = '');
          pinInputs[0].focus();
        }
      } catch(err) {
        authError.textContent = "Błąd połączenia. Sprawdź internet.";
        authError.classList.remove('hidden');
        btnVerify.textContent = 'Odblokuj dostęp';
      }
    });

    function showApp() {
      appScreen.classList.remove('hidden');
      const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
      const title = userData.academic_title ? userData.academic_title + ' ' : '';
      userNameEl.textContent = `${title}${userData.first_name} ${userData.last_name}`;
    }
  </script>
</body>
</html>
